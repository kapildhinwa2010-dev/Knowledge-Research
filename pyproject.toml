[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge_research"
version = "0.1.0"
description = "Knowledge-Research - Research framework for derived-knowledge experiments"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
